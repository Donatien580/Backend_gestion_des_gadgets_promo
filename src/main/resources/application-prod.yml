spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.entreprise.gadgets: INFO
    root: WARN

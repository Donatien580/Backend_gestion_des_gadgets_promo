spring:
  application:
    name: gadgets-backend

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      # Flyway gère le schéma -> Hibernate ne fait que valider qu'il correspond aux entités
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Configuration Gmail SMTP pour l'envoi des notifications
  # ⚠️ Ne jamais mettre les identifiants en dur : utiliser un "mot de passe d'application" Google
  # et les variables d'environnement MAIL_USERNAME / MAIL_PASSWORD.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.entreprise.gadgets: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

# Paramètres métier propres à l'application (seuils par défaut, etc.)
app:
  gadgets:
    seuil-alerte-defaut: 50
  cors:
    allowed-origins: http://localhost:4200
  uploads:
    # Dossier sur disque (relatif au répertoire de lancement de l'appli en dev).
    # En prod, pointer vers un chemin absolu monté en volume persistant.
    dossier: uploads
    taille-max-mo: 5

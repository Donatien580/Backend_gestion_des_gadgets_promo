version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres_gadgets
    environment:
      - POSTGRES_DB=gadgets_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - gadgets_pgdata:/var/lib/postgresql/data

volumes:
  gadgets_pgdata:
